<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Termina">
  <title>Termina</title>
  <!-- Brand tokens, kept in sync with app/assets/css/terminal.css:
       --color-bg-primary #0a0a0f, --color-radiant rgb(64 240 144). -->
  <rect width="64" height="64" rx="12" fill="#0a0a0f"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="10.5" fill="none"
        stroke="#40f090" stroke-opacity="0.35" stroke-width="3"/>
  <!-- A shell prompt: chevron + cursor. One idea, two strokes — anything more
       detailed dissolves into mush at the 16px favicon size. -->
  <path d="M16 20 L30 32 L16 44" fill="none" stroke="#40f090" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="38" width="16" height="6" rx="3" fill="#40f090"/>
</svg>
