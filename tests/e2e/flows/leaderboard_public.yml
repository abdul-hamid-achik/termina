version: 1
name: leaderboard_public
intent: The /leaderboard is public — an anonymous visitor sees the ladder panel
  without logging in. The ladder lists only players past the placement
  requirement, so a fresh database renders the placement explainer rather than a
  table; the flow accepts either, because both are correct states of the same
  page and which one appears depends on match history, not on the page working.
mode: normal
metadata:
  feature: leaderboard
  tags:
    - leaderboard
    - public
outcomes:
  - id: leaderboard_renders_anon
    description: the leaderboard panel renders for an anonymous visitor
    verify:
      text:
        contains: top players by rating
  - id: qualification_bar_stated
    description: the header states how many ranked matches qualify a player
    verify:
      text:
        contains: ranked matches to qualify
  - id: ladder_or_placement_explainer
    description: >-
      the page shows the ranked table, or explains the placement requirement —
      never an unexplained void
    verify:
      script:
        run: |
          const table = document.querySelector('tbody');
          const rows = table ? table.querySelectorAll('tr').length : 0;
          const body = document.body.innerText;
          const explainer = body.includes('placement matches yet');
          return {
            ok: rows > 0 || explainer,
            evidence: 'rows=' + rows + ' placementExplainer=' + explainer,
          };
steps:
  - id: open_leaderboard
    open: /leaderboard
  - id: wait_for_panel
    wait:
      text: top players by rating
      timeoutMs: 10000
contractHash: sha256:94e17a91e6dd73fd182d67a369d74f5eb9f48cc636f2b871a23d4462b11f8007
