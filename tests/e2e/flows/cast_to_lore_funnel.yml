version: 1
name: cast_to_lore_funnel
intent: The funnel runs both ways — from the /cast console (deep-linked to
  Daemon), the "> LORE" link carries you to /lore anchored at that hero's lore
  card.
mode: normal
metadata:
  feature: cast
  tags:
    - cast
    - lore
    - public
    - funnel
outcomes:
  - id: reverse_funnel_reaches_lore
    description: following the console's LORE link lands on the lore page
    verify:
      text:
        contains: TERMINA
  - id: reverse_funnel_shows_hero
    description: the lore page shows the hero whose lore was requested (Daemon)
    verify:
      text:
        contains: Daemon
steps:
  - id: open_console_for_daemon
    open: /cast?hero=daemon
  - id: wait_for_console
    wait:
      text: DRY RUN
      timeoutMs: 10000
  - id: click_lore_link
    click:
      by: selector
      selector: a[href="/lore#lore-daemon"]
  - id: await_lore
    wait:
      text: TERMINA
      timeoutMs: 10000
contractHash: sha256:5cdccad0b6521b709433639f5c280056855a7540d8f64cf934c51ff42613c516
