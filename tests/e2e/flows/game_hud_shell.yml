version: 1
name: game_hud_shell
intent: >
  The post-R3 terminal HUD: status lines carry the cycle clock and hop/threat
  readout, the TRACE rail shows hop depth and terminals, the STREAM is present,
  and the ActionRow/command prompt are the input surface. UI shell only — engine
  truth is `bun run test:gameplay`.
mode: normal
metadata:
  feature: game-hud
  tags:
    - game
    - hud
    - terminal
    - trace
imports:
  - ../actions/login.yml
outcomes:
  - id: status_clock_present
    description: status lines render the cycle clock; old GameStateBar countdown is gone
    verify:
      script:
        run: >
          const clock = document.querySelector('[data-testid="status-clock"]');

          const barCountdown =
          document.querySelector('[data-testid="tick-countdown"]');

          return { ok: !!clock && !barCountdown, evidence: 'clock=' + !!clock +
          ' oldBarCountdown=' + !!barCountdown };
  - id: trace_rail_present
    description: the TRACE rail shows the current hop and both terminals
    verify:
      script:
        run: >
          const rail = document.querySelector('[data-testid="trace-rail"]');

          const hop = document.querySelector('[data-testid="trace-current"]');

          const terminals =
          document.querySelector('[data-testid="trace-terminals"]');

          return { ok: !!rail && !!hop && !!terminals, evidence: 'rail=' +
          !!rail + ' hop=' + !!hop + ' terminals=' + !!terminals };
  - id: stream_present
    description: the STREAM (combat log) owns the center column
    verify:
      script:
        run: >
          const stream = document.querySelector('[data-testid="combat-log"]');

          return { ok: !!stream, evidence: 'stream=' + !!stream };
steps:
  - use: login
  - id: open_home
    open: /
  - id: confirm_logged_in
    wait:
      text: "[LOGOUT]"
      timeoutMs: 10000
  - id: click_practice
    click:
      by: selector
      selector: '[data-testid="start-tutorial"]'
  - id: await_game_screen
    wait:
      selector: '[data-testid="game-screen"]'
      timeoutMs: 20000
  - id: await_status_lines
    wait:
      selector: '[data-testid="status-lines"]'
      timeoutMs: 15000
  - id: await_trace_rail
    wait:
      selector: '[data-testid="trace-rail"]'
      timeoutMs: 10000
  - id: await_stream
    wait:
      selector: '[data-testid="combat-log"]'
      timeoutMs: 10000
contractHash: sha256:080d2984594b8ce93c4881f58ee69708b5c179d58eae87f81727be8242b0b832
