version: 1
name: heroes_to_lore_funnel
intent: The funnel runs both ways — from the /heroes console (deep-linked to
  Daemon), the "> LORE" link carries you to /lore anchored at that hero's lore
  card.
mode: normal
metadata:
  feature: heroes
  tags:
    - heroes
    - lore
    - public
    - funnel
outcomes:
  - id: reverse_funnel_reaches_lore
    description: following the console's LORE link lands on the lore page
    verify:
      text:
        contains: TERMINA
  - id: reverse_funnel_shows_hero
    description: the lore page shows the hero whose lore was requested (Daemon)
    verify:
      text:
        contains: Daemon
steps:
  - id: open_console_for_daemon
    open: /heroes?hero=daemon
  - id: wait_for_console
    wait:
      text: DRY RUN
      timeoutMs: 10000
  - id: click_lore_link
    click:
      by: selector
      selector: a[href="/lore#lore-daemon"]
  - id: await_lore
    wait:
      text: TERMINA
      timeoutMs: 10000
contractHash: sha256:42fbe05f3e22887afe40556a328cd66582e5f42a1ab8ca8a60d645509fd2d035
