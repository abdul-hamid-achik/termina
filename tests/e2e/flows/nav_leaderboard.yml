version: 1
name: nav_leaderboard
intent: The public /leaderboard page renders the ladder panel for a signed-in
  player. The ladder is gated on placement matches, so a fresh account sees the
  placement explainer rather than the table — the flow asserts the panel and its
  qualification bar, and accepts either populated state.
mode: normal
metadata:
  feature: navigation
  tags:
    - leaderboard
    - navigation
    - public
imports:
  - ../actions/login.yml
outcomes:
  - id: on_leaderboard_route
    description: the browser is on the public /leaderboard route
    verify:
      url:
        matches: /leaderboard
  - id: leaderboard_panel_renders
    description: the Leaderboard panel renders its "top players by rating" subtitle
    verify:
      text:
        contains: top players by rating
  - id: qualification_bar_stated
    description: the panel states the placement requirement to qualify
    verify:
      text:
        contains: ranked matches to qualify
  - id: table_headers_when_populated
    description: >-
      when the ladder has qualified players the #/Player/Rating headers render;
      when it does not, the placement explainer takes their place
    verify:
      script:
        run: |
          const rows = document.querySelectorAll('tbody tr').length;
          const body = document.body.innerText;
          const headers = ['#', 'Player', 'Rating'].every((h) => body.includes(h));
          const explainer = body.includes('placement matches yet');
          return {
            ok: rows > 0 ? headers : explainer,
            evidence: 'rows=' + rows + ' headers=' + headers + ' explainer=' + explainer,
          };
steps:
  - use: login
  - id: open_leaderboard
    open: /leaderboard
  - id: await_panel
    wait:
      text: ranked matches to qualify
      timeoutMs: 10000
contractHash: sha256:b3a7c735eb74d72aec42ca1fd9fcaa133e41199dcce8dfe7245d310dbe55470d
