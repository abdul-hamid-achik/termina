version: 1
name: hud_settings_roster
intent: >
  The "HUD & Display" settings panel exposes the new War Room roster toggle:
  flipping "Show team roster in War Room" turns it On, re-derives the preset to
  Custom, and persists the choice in localStorage across a reload. Guards the
  settings wiring for the simplified-default-HUD feature.
mode: normal
metadata:
  feature: settings
  tags:
    - settings
    - hud
    - war-room
imports:
  - ../actions/login.yml
outcomes:
  - id: preset_rederives_to_custom
    description: changing one HUD field switches the preset readout to Custom
    verify:
      text:
        contains: Custom
        region: '[data-testid="hud-settings"]'
  - id: choice_persists_across_reload
    description: after a reload the toggle still reads On (persisted via localStorage)
    verify:
      script:
        run: >
          const btn =
          document.querySelector('[data-testid="hud-toggle-rosterExpanded"]');

          const pressed = btn ? btn.getAttribute('aria-pressed') : null;

          return { ok: pressed === 'true', evidence: 'aria-pressed=' + pressed
          };
steps:
  - use: login
  - id: open_settings
    open:
      path: /profile/settings
      waitUntil: domcontentloaded
  - id: await_hud_panel
    wait:
      selector: '[data-testid="hud-settings"]'
      timeoutMs: 15000
  - id: toggle_roster
    click:
      by: selector
      selector: '[data-testid="hud-toggle-rosterExpanded"]'
  - id: await_on
    wait:
      selector: '[data-testid="hud-toggle-rosterExpanded"][aria-pressed="true"]'
      timeoutMs: 10000
  - id: reload_settings
    open:
      path: /profile/settings
      waitUntil: domcontentloaded
  - id: await_hud_panel_again
    wait:
      selector: '[data-testid="hud-settings"]'
      timeoutMs: 15000
contractHash: sha256:5c7061fc117c0980144e53a6b5cfaceefb4df0bcbb937d37accd851df13a8057
