version: 1
name: lore_to_cast_funnel
intent: The learning funnel connects — reading a hero's lore on /lore, the
  "TRAIN" link carries you to the /cast console with that exact hero (Echo)
  preselected, ready to cast its kit.
mode: normal
metadata:
  feature: lore
  tags:
    - lore
    - cast
    - public
    - funnel
outcomes:
  - id: funnel_navigates_to_console
    description: following a lore TRAIN link lands on the hero training console
    verify:
      text:
        contains: DRY RUN
  - id: funnel_preselects_the_hero
    description: the console opens on the chosen hero's kit (Echo's Q, Resonance)
    verify:
      text:
        contains: Resonance
steps:
  - id: open_lore
    open: /lore
  - id: wait_for_lore
    wait:
      text: TERMINA
      timeoutMs: 10000
  - id: click_train_echo
    click:
      by: selector
      selector: a[href="/cast?hero=echo"]
  - id: await_console
    wait:
      text: DRY RUN
      timeoutMs: 10000
  - id: await_echo_kit
    wait:
      text: Resonance
      timeoutMs: 10000
contractHash: sha256:b5a97ea4e332eac092ab83467c75418e4678b15551b1271c16a22e9c41b6e01f
