version: 1
name: game_feed_story
intent: >
  The combat feed's default "cycle story" view in a live game: events group
  under CYCLE beat headers, and everyone's farming folds into the dim per-cycle
  "farm:" digest line instead of a line-per-wave-hit firehose (the legibility
  overhaul's centerpiece). The engine mechanics that GENERATE those events (bot
  AI, last-hit scrip) are covered by `bun run test:gameplay`; this asserts what
  the player actually reads.
mode: normal
metadata:
  feature: game-feed
  tags:
    - game
    - feed
    - cycle-story
imports:
  - ../actions/login.yml
outcomes:
  - id: feed_groups_into_cycle_beats
    description: the feed renders CYCLE beat headers (the per-cycle grouping of the
      story view)
    verify:
      text:
        contains: CYCLE
        region: '[data-testid="combat-log"]'
  - id: feed_narrates_the_live_game
    description: engine events reach the feed as readable combat lines (a
      frozen/silent feed was a real regression this flow caught) — the
      farm-digest folding itself is unit-tested
    verify:
      script:
        run: >
          const log = document.querySelector('[data-testid="combat-log"]');

          const t = log ? log.textContent : '';

          const beats = (t.match(/CYCLE \d+/g) || []).length;

          const combat =
          /\[DAMAGE\]|\[KILL\]|\[ABILITY\]|\[GOLD\]|farm:/.test(t);

          return { ok: beats >= 2 && combat, evidence: 'beats=' + beats + '
          combatLines=' + combat };
steps:
  - use: login
  - id: open_home
    open: /
  - id: confirm_logged_in
    wait:
      text: "[LOGOUT]"
      timeoutMs: 10000
  - id: click_practice
    click:
      by: selector
      selector: '[data-testid="start-tutorial"]'
  - id: await_game_screen
    wait:
      selector: '[data-testid="game-screen"]'
      timeoutMs: 20000
  # Bots need to lane + fight before the feed has anything to narrate — under
  # TERMINA_TEST_FAST_GAME=8 that's typically well under a minute.
  - id: await_combat_lines
    wait:
      text: "[DAMAGE]"
      timeoutMs: 90000
contractHash: sha256:e0f3cabd698c1a3c1f65480b066973200c8cb02dc6fce79f277cc04f7d734c37
