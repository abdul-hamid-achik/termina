version: 1
name: game_scoreboard_overlay
intent: >
  The scoreboard overlay: the SCORE button opens it with both team blocks and
  the player's row, and the close affordance dismisses it. Pure HUD interaction
  — the stats inside are engine truth covered elsewhere.
mode: normal
metadata:
  feature: game-hud
  tags:
    - game
    - scoreboard
imports:
  - ../actions/login.yml
outcomes:
  - id: scoreboard_closed_after_dismiss
    description: the overlay is gone after the close button
    verify:
      script:
        run: >
          const sb =
          document.querySelector('[data-testid="scoreboard-overlay"]');

          return { ok: !sb, evidence: 'scoreboard-overlay still mounted=' + !!sb
          };
steps:
  - use: login
  - id: open_home
    open: /
  - id: confirm_logged_in
    wait:
      text: "[LOGOUT]"
      timeoutMs: 10000
  - id: click_practice
    click:
      by: selector
      selector: '[data-testid="start-tutorial"]'
  - id: await_game_screen
    wait:
      selector: '[data-testid="game-screen"]'
      timeoutMs: 20000
  # Desktop (pointer:fine) hides ActionRow — the prompt is primary (R3-09).
  # Tab is hold-to-show / release-to-hide, so a single `press: Tab` would close
  # on keyup. Dispatch a synthetic click on the (display:none) SCORE chip
  # instead — it still fires the Vue handler.
  - id: open_scoreboard
    eval:
      js: |
        const el = document.querySelector('[data-testid="action-score"]');
        if (!el) return { ok: false, reason: 'action-score missing' };
        el.click();
        return { ok: true };
  - id: await_scoreboard
    wait:
      selector: '[data-testid="scoreboard-overlay"]'
      timeoutMs: 10000
  - id: see_chaff_block
    wait:
      selector: '[data-testid="scoreboard-team-chaff"]'
      timeoutMs: 5000
  - id: see_audit_block
    wait:
      selector: '[data-testid="scoreboard-team-audit"]'
      timeoutMs: 5000
  - id: close_scoreboard
    click:
      by: role
      role: button
      name: "[tap outside or here to close]"
  - id: await_closed
    wait:
      notText: tap outside or here to close
      timeoutMs: 5000
contractHash: sha256:77e0205934ddf5c51ca13c50e3ab0ba2242341f326c75eb7ae7a7b8fb216342e
