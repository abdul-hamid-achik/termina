name: 'Postgres'
description: >
  Start Postgres as a host-published container with retryable image pulls,
  then wait until it's healthy. Replaces the byte-identical inline blocks
  that used to live in integration / coverage / e2e. NOT `services:` — that
  can't retry a transient Docker Hub pull/429, which hard-fails the job.
  Requires actions/checkout to have run first (it's a local composite action).

  Was 'pg-redis' (Postgres + Redis) until the all-Vercel cutover deleted
  every Redis-backed subsystem (RedisService, the DO-era WS game server,
  the Redis matchmaking queue) — nothing in the test suite talks to Redis
  anymore, so the Redis container it used to boot alongside Postgres is gone.

inputs:
  postgres-image:
    description: Postgres image tag (passed in from the workflow env for one source of truth)
    required: true
  postgres-db:
    description: Database created on first boot
    required: false
    default: termina_test

runs:
  using: composite
  steps:
    - name: Start Postgres (with pull retry)
      shell: bash
      run: |
        set -euo pipefail
        pull_retry() {
          for i in 1 2 3 4 5; do
            if docker pull "$1"; then return 0; fi
            echo "::warning::docker pull $1 failed (attempt $i), backing off..."
            sleep $((i * 10))
          done
          echo "::error::docker pull $1 failed after 5 attempts"; return 1
        }
        pull_retry "${{ inputs.postgres-image }}"
        docker run -d --name postgres \
          -e POSTGRES_USER=termina -e POSTGRES_PASSWORD=termina -e POSTGRES_DB=${{ inputs.postgres-db }} \
          -p 5432:5432 \
          --health-cmd "pg_isready -U termina" \
          --health-interval 5s --health-timeout 5s --health-retries 20 \
          "${{ inputs.postgres-image }}"

    - name: Wait for Postgres to be healthy
      shell: bash
      run: |
        set -euo pipefail
        echo "waiting for postgres..."
        for _ in $(seq 1 30); do
          status="$(docker inspect -f '{{.State.Health.Status}}' postgres 2>/dev/null || echo starting)"
          if [ "$status" = healthy ]; then echo "postgres healthy"; break; fi
          sleep 2
        done
        if [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" != healthy ]; then
          echo "::error::postgres did not become healthy"; docker logs postgres || true; exit 1
        fi
